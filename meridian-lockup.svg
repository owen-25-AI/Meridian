<svg viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="26" y1="26" x2="94" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- icon badge -->
  <rect x="6" y="13" width="64" height="64" rx="18" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- mark, scaled 0.4x from the 120x120 native icon and positioned inside the badge -->
  <g transform="translate(14,21) scale(0.4)">
    <circle cx="60" cy="60" r="34" fill="none" stroke="url(#ring)" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="160 54"
            transform="rotate(-38 60 60)" opacity="0.9"/>
    <circle cx="86" cy="33" r="6" fill="#5eead4" opacity="0.35"/>
    <circle cx="86" cy="33" r="2.6" fill="#f0fffb"/>
    <path d="M12,60 L38,60 L47,40 L58,80 L67,48 L75,60 L108,60"
          fill="none" stroke="#f0fffb" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <text x="84" y="57" font-family="'Space Grotesk','Inter',sans-serif" font-weight="600"
        font-size="34" letter-spacing="-0.5" fill="#f4fbfa">meridian</text>
</svg>
